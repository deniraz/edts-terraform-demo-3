name: terraform-plan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write  
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-southeast-1

      - name: Terraform Init
        run: terraform init -no-color

      - name: Terraform Validate
        run: terraform validate -no-color
      
      # - name: Security Scan (tfsec)
      #   uses: aquasecurity/tfsec-action@v1.0.3
      #   with:
      #     soft_fail: false

      # - name: Security Scan (Checkov)
      #   uses: bridgecrewio/checkov-action@v12
      #   with:
      #     directory: .
      #     framework: terraform
      #     soft_fail: false

      - name: Security Scan (Checkov - SSH only)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          check: CKV_AWS_24
          soft_fail: false

      - name: Terraform Plan
        run: terraform plan -no-color

      # Generate a binary plan file (review artifact)
      - name: Terraform Plan (binary artifact)
        run: terraform plan -no-color -out=tfplan

      # Optional: also generate human-readable plan text
      - name: Terraform Show (text)
        run: terraform show -no-color tfplan | tee plan.txt

      - name: Upload Plan Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            tfplan
            plan.txt
